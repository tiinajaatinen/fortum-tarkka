<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pörssisähkö tänään</title>

<style>

body{
    font-family: Arial, sans-serif;
    max-width:700px;
    margin:auto;
    padding:20px;
    background:#f5f5f5;
}

h1{
    text-align:center;
}

.hour{
    padding:10px;
    margin:4px 0;
    border-radius:8px;
    color:white;
    font-weight:bold;
}

.green{
    background:#2e7d32;
}

.yellow{
    background:#f9a825;
}

.red{
    background:#c62828;
}

#best{
    background:white;
    padding:15px;
    border-radius:8px;
    margin-bottom:20px;
}

</style>

</head>
<body>

<h1>⚡ Sähkön hinnat tänään</h1>

<div id="best">
Ladataan...
</div>

<div id="hours"></div>

<script>

const margin = 0.45;
const vat = 1.255;

async function loadPrices(){

    const response =
      await fetch("https://api.porssisahko.net/v1/latest-prices.json");

    const data = await response.json();

    const prices = data.prices
      .slice(0,24)
      .reverse()
      .map(p => {

        const fortum =
          ((p.price + margin) * vat);

        return {
          hour:new Date(p.startDate).getHours(),
          price:fortum
        };

      });

    const cheapest =
      [...prices].sort((a,b)=>a.price-b.price)[0];

    document.getElementById("best").innerHTML = `
      <h2>✅ Päivän halvin tunti</h2>
      <p><b>${String(cheapest.hour).padStart(2,"0")}:00</b></p>
      <p>${cheapest.price.toFixed(2)} snt/kWh</p>
    `;

    const hoursDiv = document.getElementById("hours");

    prices.forEach(p => {

        let color="green";

        if(p.price >=5) color="yellow";
        if(p.price >=10) color="red";

        hoursDiv.innerHTML += `
        <div class="hour ${color}">
            ${String(p.hour).padStart(2,"0")}:00
            - ${p.price.toFixed(2)} snt/kWh
        </div>`;
    });

}

loadPrices();

</script>

</body>
</html>
