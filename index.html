<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Fortum Tarkka - Sähkön hinta</title>

<style>
body {
    font-family: Arial, sans-serif;
    max-width: 800px;
    margin: auto;
    padding: 20px;
    background: #f4f4f4;
}

h1 {
    text-align: center;
}

.card {
    background: white;
    padding: 15px;
    border-radius: 10px;
    margin-bottom: 15px;
}

.hour {
    padding: 10px;
    margin: 4px 0;
    color: white;
    border-radius: 8px;
    font-weight: bold;
}

.green { background: #2e7d32; }
.yellow { background: #f9a825; }
.red { background: #c62828; }

.big {
    font-size: 1.3em;
    font-weight: bold;
}
</style>

</head>
<body>

<h1>⚡ Fortum Tarkka</h1>

<div id="status" class="card">
Ladataan sähkön hintoja...
</div>

<div id="hours"></div>

<script>

const MARGIN = 0.45;
const VAT = 1.255;

async function loadPrices() {

    try {

        const url =
        'https://api.allorigins.win/raw?url=' +
        encodeURIComponent('https://api.porssisahko.net/v1/latest-prices.json');

    const response = await fetch(url);
        );

        const data = await response.json();

        const prices = data.prices
            .slice(0,24)
            .reverse()
            .map(p => ({
                hour: new Date(p.startDate).getHours(),
                price: (p.price + MARGIN) * VAT
            }));

        const cheapest =
            [...prices].sort((a,b)=>a.price-b.price)[0];

        let best3h = {
            start: 0,
            avg: 999
        };

        for(let i=0; i<prices.length-2; i++) {

            const avg =
            (prices[i].price +
             prices[i+1].price +
             prices[i+2].price) / 3;

            if(avg < best3h.avg) {
                best3h.avg = avg;
                best3h.start = prices[i].hour;
            }
        }

        document.getElementById("status").innerHTML = `
            <div class="big">
              ✅ Halvin tunti:
              ${String(cheapest.hour).padStart(2,"0")}:00
              (${cheapest.price.toFixed(2)} snt/kWh)
            </div>

            <br>

            <div class="big">
              ✅ Paras 3 tunnin jakso:
              ${String(best3h.start).padStart(2,"0")}:00 -
              ${String((best3h.start+3)%24).padStart(2,"0")}:00
            </div>
        `;

        const hours = document.getElementById("hours");
        hours.innerHTML = "";

        prices.forEach(p => {

            let color = "green";

            if(p.price >= 5)
                color = "yellow";

            if(p.price >= 10)
                color = "red";

            hours.innerHTML += `
                <div class="hour ${color}">
                    ${String(p.hour).padStart(2,"0")}:00
                    - ${p.price.toFixed(2)} snt/kWh
                </div>
            `;
        });

    } catch(error) {

        document.getElementById("status").innerHTML = `
            <b>Hintojen lataus epäonnistui.</b><br><br>
            Päivitä sivu muutaman minuutin kuluttua.
        `;

        console.error(error);
    }
}

loadPrices();

</script>

</body>
</html>
