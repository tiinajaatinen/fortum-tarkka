<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Sähkönkäyttö</title>

<style>

body{
    font-family: Arial, sans-serif;
    max-width:700px;
    margin:auto;
    padding:20px;
    background:#f2f2f2;
}

h1{
    text-align:center;
}

.card{
    background:white;
    border-radius:12px;
    padding:15px;
    margin-bottom:15px;
}

.big{
    font-size:1.4em;
    font-weight:bold;
}

.hour{
    padding:8px;
    margin:4px 0;
    border-radius:6px;
    color:white;
    font-weight:bold;
}

.bg-green{
    background:#2e7d32;
}

.bg-yellow{
    background:#f9a825;
}

.bg-red{
    background:#c62828;
}

.day-header{
    font-size:1.1em;
    font-weight:bold;
    margin-top:15px;
    margin-bottom:5px;
}

</style>
</head>

<body>

<h1>⚡ Sähkönkäyttö</h1>

<div id="summary" class="card">
Ladataan...
</div>

<div id="hours" class="card">
</div>

<script>

const MARGIN = 0.59;
const VAT = 1.255;

function colorClass(price){

    if(price < 5)
        return "bg-green";

    if(price < 10)
        return "bg-yellow";

    return "bg-red";
}

async function loadPrices(){

    const response = await fetch("/api/prices");
    const data = await response.json();

    const prices =
        data.prices
            .slice()
            .reverse()
            .map(p => {

                const d = new Date(p.startDate);

                return {
                    hour: d.getHours(),
                    date: d,
                    price: (p.price + MARGIN) * VAT
                };
            });

    const nowDate = new Date();
    const currentHour = nowDate.getHours();

    const orderedPrices = [
        ...prices.filter(
            p =>
            p.date.toDateString() === nowDate.toDateString() &&
            p.hour >= currentHour
        ),
        ...prices.filter(
            p =>
            p.date > nowDate &&
            p.date.toDateString() !== nowDate.toDateString()
        ),
        ...prices.filter(
            p =>
            p.date.toDateString() === nowDate.toDateString() &&
            p.hour < currentHour
        )
    ];

    const now = orderedPrices[0];

    let best3 = {
        start:0,
        end:0,
        avg:999,
        date:null
    };

    for(let i=0; i<orderedPrices.length-2; i++){

        const avg =
            (orderedPrices[i].price +
             orderedPrices[i+1].price +
             orderedPrices[i+2].price) / 3;

        if(avg < best3.avg){

            best3.avg = avg;
            best3.start = orderedPrices[i].hour;
            best3.end = orderedPrices[i+2].hour + 1;
            best3.date = orderedPrices[i].date;
        }
    }

    const best3Label =
        best3.date.toDateString() === nowDate.toDateString()
            ? "Tänään"
            : "Huomenna";

    let traffic = "🔴 Kallista";

    if(now.price < 5)
        traffic = "🟢 Halpaa";
    else if(now.price < 10)
        traffic = "🟡 Normaalia";

    document.getElementById("summary").innerHTML = `

        <div class="big">
            ${traffic}
        </div>

        <p>
            Nykyinen hinta:
            <b>${now.price.toFixed(2)} snt/kWh</b>
        </p>

        <p>
            ✅ Paras 3 tunnin pesujakso:
        </p>

        <p>
            <b>
                ${best3Label}
                ${best3.date.getDate()}.
                ${best3.date.getMonth() + 1}.
                ${best3.date.getFullYear()}
                <br>
                ${String(best3.start).padStart(2,"0")}:00 -
                ${String(best3.end % 24).padStart(2,"0")}:00
            </b>
        </p>

        <p>
            Keskimääräinen hinta:
            <b>${best3.avg.toFixed(2)} snt/kWh</b>
        </p>

        <p>
            Astianpesukone ✅<br>
            Pyykinpesukone ✅
        </p>
    `;

    const hours = document.getElementById("hours");

    hours.innerHTML = "";

    let lastDate = "";

    orderedPrices.forEach(p => {

        const thisDate =
            `${p.date.getDate()}-${p.date.getMonth()}-${p.date.getFullYear()}`;

        if(thisDate !== lastDate){

            const dayLabel =
                p.date.toDateString() === nowDate.toDateString()
                ? `Tänään ${p.date.getDate()}.${p.date.getMonth()+1}.${p.date.getFullYear()}`
                : `Huomenna ${p.date.getDate()}.${p.date.getMonth()+1}.${p.date.getFullYear()}`;

            hours.innerHTML += `
                <div class="day-header">
                    ${dayLabel}
                </div>
            `;

            lastDate = thisDate;
        }

        const marker =
            p.date.toDateString() === nowDate.toDateString() &&
            p.hour === currentHour
                ? "👉 NYT "
                : "";

        hours.innerHTML += `
            <div class="hour ${colorClass(p.price)}">
                ${marker}
                ${String(p.hour).padStart(2,"0")}:00
                - ${p.price.toFixed(2)} snt/kWh
            </div>
        `;
    });
}

loadPrices();

</script>

</body>
</html>
